plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
}

group = 'com.moontweaker'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

minecraft {
    mcVersion.set('1.12.2')
    username.set('Developer')
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.cleanroommc.com' }
    maven { url = 'https://nexus.gtnewhorizons.com/repository/public/' }
}

configurations {
    embed
}

dependencies {
    implementation 'org.luaj:luaj-jse:3.0.1'
    embed 'org.luaj:luaj-jse:3.0.1'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/MANIFEST.MF'
    from('LICENSE')
    from('NOTICE')
}

tasks.configureEach {
    if (name == 'compileInjectedTagsJava') {
        dependsOn 'injectTags'
    }
    if (name.startsWith('compilePatchedMc')) {
        dependsOn 'decompressDecompiledSources'
    }
    if (name.startsWith('compileMcLauncher')) {
        dependsOn 'createMcLauncherFiles'
    }
}